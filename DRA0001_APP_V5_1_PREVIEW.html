<body><div id="error" role="alert"><h2>Portal tidak dapat dimuatkan</h2><p>Pastikan fail <code>DRA0001.html</code>, <code>workspace-v4.4.css</code> dan <code>workspace-v4.4.js</code> berada dalam folder yang sama. Sambung ke internet dan cuba muat semula. Portal asal tidak diubah.</p></div>
<iframe id="portal" src="DRA0001.html" title="SMKATB One Stop Centre"></iframe>
<script>
const frame=document.getElementById('portal');
function fail(){document.getElementById('error').style.display='block';frame.style.display='none'}
frame.addEventListener('load',()=>{try{
 const d=frame.contentDocument;
 const favicon=d.createElement('link');favicon.rel='icon';favicon.type='image/png';favicon.href='logo.png';d.head.appendChild(favicon);
 if(!d||!d.getElementById('onestop')||!d.querySelector('.sidebar'))return fail();
 const sheet=d.createElement('link');sheet.rel='stylesheet';sheet.href='workspace-v4.4.css?v=51';d.head.appendChild(sheet);
 const contrast=d.createElement('link');contrast.rel='stylesheet';contrast.href='kontras-v5.1.css?v=51';d.head.appendChild(contrast);
 const script=d.createElement('script');script.src='workspace-v4.4.js?v=51';script.onerror=fail;d.body.appendChild(script);
}catch(e){fail()}});
</script><script>if ('serviceWorker' in navigator) { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }</script></body></html>
