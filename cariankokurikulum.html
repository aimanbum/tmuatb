<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kokurikulum SMKA Tok Bachok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            margin: 0; padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 119, 181, 0.15); width: 100%; max-width: 500px;
            border-top: 5px solid #0077b5; text-align: center;
        }
        .school-logo { max-width: 120px; height: auto; margin-bottom: 20px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1)); }
        h2 { margin-top: 0; color: #1e3a8a; font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; font-weight: 300; }
        
        /* Tab Navigation */
        .tabs { display: flex; justify-content: center; margin-bottom: 25px; border-radius: 50px; background: #f1f5f9; padding: 5px; }
        .tab-btn {
            flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer;
            font-family: 'Poppins', sans-serif; font-weight: 600; color: #64748b; border-radius: 50px; font-size: 14px;
        }
        .tab-btn.active { background: #0077b5; color: white; box-shadow: 0 4px 6px rgba(0, 119, 181, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Form Elements */
        .form-group { position: relative; margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #475569; font-weight: 600; font-size: 14px; }
        input[type="text"], select {
            width: 100%; padding: 15px 20px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-size: 15px; font-family: 'Poppins', sans-serif; background-color: #f8fafc;
            appearance: none; -webkit-appearance: none;
        }
        input:focus, select:focus { outline: none; border-color: #0077b5; background-color: white; }
        
        /* Custom Select Arrow */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▼'; font-size: 12px; color: #0077b5; position: absolute; right: 20px; top: 18px; pointer-events: none;
        }

        button.action-btn {
            width: 100%; padding: 15px; color: white; border: none; border-radius: 10px;
            cursor: pointer; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            background: linear-gradient(90deg, #0077b5 0%, #00a0dc 100%);
        }
        button.action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 119, 181, 0.3); }
        button.action-btn.green { background: linear-gradient(90deg, #16a085 0%, #2ecc71 100%); margin-top: 10px;}

        /* Results */
        #result { margin-top: 25px; padding: 20px; border-radius: 12px; display: none; line-height: 1.8; text-align: left; font-size: 15px; }
        .result-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 8px 0; }
        .result-label { font-weight: 600; color: #475569; flex-shrink: 0; margin-right: 15px; }
        .result-value { color: #1e293b; text-align: right; }
        .success { background-color: #f0fdf4; border: 1px solid #b91c1c20; border-left: 5px solid #166534; }
        .error { background-color: #fef2f2; color: #991b1b; border: 1px solid #f8717150; border-left: 5px solid #991b1b; padding:15px; margin-top:20px; text-align:left; border-radius:8px;}
        .loading { text-align: center; font-style: italic; color: #0077b5; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Logo SMKA Tok Bachok" class="school-logo" onerror="this.style.display='none'">
    <h2>Sistem Koko T1</h2>
    <p class="subtitle">SMKA Tok Bachok</p>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('semakan')">Semakan Pelajar</button>
        <button class="tab-btn" onclick="switchTab('guru')">Muat Turun (Guru)</button>
    </div>

    <div id="tab-semakan" class="tab-content active">
        <div class="form-group">
            <input type="text" id="icInput" placeholder="Sila masukkan No. IC (Tanpa Sengkang)" maxlength="12">
        </div>
        <button class="action-btn" onclick="semakData()">Cari Rekod</button>
        
        <div id="loading" class="loading">Sedang menyemak pangkalan data...</div>
        <div id="result"></div>
    </div>

    <div id="tab-guru" class="tab-content">
        <div class="form-group">
            <label>Kategori Utama:</label>
            <div class="select-wrapper">
                <select id="jenisKategori" onchange="tukarPilihanSenarai()">
                    <option value="5">Badan Beruniform</option>
                    <option value="6">Kelab & Persatuan</option>
                    <option value="7">Sukan & Permainan</option>
                    <option value="8">Rumah Sukan</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label>Pilih Unit / Pasukan:</label>
            
            <div id="div-5" class="select-wrapper">
                <select id="pilihan-5" class="pilihan-khas">
                    <option value="BOMBA">BOMBA</option>
                    <option value="BRIGED">BRIGED</option>
                    <option value="BSMM">BSMM</option>
                    <option value="KASPA">KASPA</option>
                    <option value="KRS">KRS</option>
                    <option value="PENGAKAP">PENGAKAP</option>
                    <option value="POLIS">POLIS</option>
                    <option value="PPIM">PPIM</option>
                </select>
            </div>

            <div id="div-6" class="select-wrapper" style="display:none;">
                <select id="pilihan-6" class="pilihan-khas">
                    <option value="AGAMA ISLAM">AGAMA ISLAM</option>
                    <option value="BA">BA (BAHASA ARAB)</option>
                    <option value="BAHASA CINA">BAHASA CINA</option>
                    <option value="BM">BM (BAHASA MELAYU)</option>
                    <option value="BI">BI (BAHASA INGGERIS)</option>
                    <option value="DR MUDA">DOKTOR MUDA</option>
                    <option value="FALAK">FALAK</option>
                    <option value="FOTOGRAFI">FOTOGRAFI</option>
                    <option value="GEOGRAFI">GEOGRAFI</option>
                    <option value="KERJAYA">KERJAYA</option>
                    <option value="KITAR SEMULA">KITAR SEMULA</option>
                    <option value="KOMPUTER">KOMPUTER</option>
                    <option value="KOPERASI">KOPERASI</option>
                    <option value="MALAYSIAKU">MALAYSIAKU</option>
                    <option value="NADI QURRA">NADI QURRA</option>
                    <option value="PENCEGAHAN JENAYAH">PENCEGAHAN JENAYAH</option>
                    <option value="PENGGUNA">PENGGUNA</option>
                    <option value="PERANCIS">PERANCIS</option>
                    <option value="PSV">PSV</option>
                    <option value="SEJARAH">SEJARAH</option>
                    <option value="SETEM FILATELI">SETEM FILATELI</option>
                    <option value="SPBT">SPBT</option>
                    <option value="STEM SAINS MATH">STEM SAINS MATH</option>
                    <option value="ULUL ALBAB">ULUL ALBAB</option>
                </select>
            </div>

            <div id="div-7" class="select-wrapper" style="display:none;">
                <select id="pilihan-7" class="pilihan-khas">
                    <option value="BADMINTON">BADMINTON</option>
                    <option value="BERKUDA EKUESTRIAN">BERKUDA EKUESTRIAN</option>
                    <option value="BOLA BALING">BOLA BALING</option>
                    <option value="BOLA JARING">BOLA JARING</option>
                    <option value="BOLA SEPAK">BOLA SEPAK</option>
                    <option value="BOLA TAMPAR">BOLA TAMPAR</option>
                    <option value="CATUR">CATUR</option>
                    <option value="HOKI">HOKI</option>
                    <option value="MEMANAH">MEMANAH</option>
                    <option value="OLAHRAGA">OLAHRAGA</option>
                    <option value="PING PONG">PING PONG</option>
                    <option value="RENANG">RENANG</option>
                    <option value="SEPAK TAKRAW">SEPAK TAKRAW</option>
                    <option value="SILAT">SILAT</option>
                    <option value="TAEKWANDO">TAEKWANDO</option>
                </select>
            </div>

            <div id="div-8" class="select-wrapper" style="display:none;">
                <select id="pilihan-8" class="pilihan-khas">
                    <option value="RUMAH AMRU (KUNING)">RUMAH AMRU (KUNING)</option>
                    <option value="RUMAH HAMZAH (HIJAU)">RUMAH HAMZAH (HIJAU)</option>
                    <option value="RUMAH KHALID (MERAH)">RUMAH KHALID (MERAH)</option>
                    <option value="RUMAH TARIQ (BIRU)">RUMAH TARIQ (BIRU)</option>
                </select>
            </div>
        </div>

        <button class="action-btn green" onclick="muatTurunExcel()">Muat Turun Excel</button>
    </div>

</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/library/d/1o_uuZ-O8M9GGf5oVJ8xC3aTe_fqFZX7eCBySPMjdYvu1Dwee3IhHT_kT/4";

    // Fungsi Tukar Tab
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        event.target.classList.add('active');
    }

    // Fungsi Tukar Dropdown berdasarkan Kategori Utama
    function tukarPilihanSenarai() {
        // Sembunyikan semua dropdown khas
        document.getElementById('div-5').style.display = 'none';
        document.getElementById('div-6').style.display = 'none';
        document.getElementById('div-7').style.display = 'none';
        document.getElementById('div-8').style.display = 'none';
        
        // Paparkan dropdown yang dipilih sahaja
        const jenisTerpilih = document.getElementById('jenisKategori').value;
        document.getElementById('div-' + jenisTerpilih).style.display = 'block';
    }

    // Fungsi Carian IC Asal
    function semakData() {
        const ic = document.getElementById("icInput").value.trim();
        const resultDiv = document.getElementById("result");
        const loadingDiv = document.getElementById("loading");

        if (!ic || !/^\d+$/.test(ic) || ic.length !== 12) {
            alert("Sila masukkan 12 digit nombor IC sahaja."); return;
        }

        resultDiv.style.display = "none";
        loadingDiv.style.display = "block";

        fetch(`${WEB_APP_URL}?action=semak&ic=${encodeURIComponent(ic)}`)
            .then(response => response.json())
            .then(data => {
                loadingDiv.style.display = "none"; resultDiv.style.display = "block";
                if (data.status === "Berjaya") {
                    resultDiv.className = "success";
                    resultDiv.innerHTML = `
                        <div style="text-align: center; margin-bottom: 15px; color: #1e3a8a;"><strong>Keputusan Carian</strong></div>
                        <div class="result-item"><span class="result-label">Nama:</span> <span class="result-value">${data.nama}</span></div>
                        <div class="result-item"><span class="result-label">Unit Beruniform:</span> <span class="result-value">${data.uniform || '-'}</span></div>
                        <div class="result-item"><span class="result-label">Rumah Sukan:</span> <span class="result-value">${data.rumahSukan || '-'}</span></div>
                        <div class="result-item"><span class="result-label">Kelab/Persatuan:</span> <span class="result-value">${data.kelab || '-'}</span></div>
                        <div class="result-item"><span class="result-label">Sukan/Permainan:</span> <span class="result-value">${data.sukan || '-'}</span></div>
                    `;
                } else {
                    resultDiv.className = "error"; resultDiv.innerHTML = `<strong>Ralat:</strong> ${data.mesej}`;
                }
            })
            .catch(error => {
                loadingDiv.style.display = "none"; resultDiv.style.display = "block";
                resultDiv.className = "error"; resultDiv.innerHTML = `<strong>Ralat:</strong> Gagal menyambung ke pangkalan data.`;
            });
    }

    // Fungsi Muat Turun Data
    function muatTurunExcel() {
        const jenis = document.getElementById("jenisKategori").value;
        const nama = document.getElementById("pilihan-" + jenis).value;

        // Menggunakan location.href memaksa browser terus muat turun fail berbanding window.open
        const downloadUrl = `${WEB_APP_URL}?action=export&jenis=${jenis}&nama=${encodeURIComponent(nama)}`;
        window.location.href = downloadUrl;
    }
</script>

</body>
</html>
