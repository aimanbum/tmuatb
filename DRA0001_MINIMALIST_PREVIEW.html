<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pratonton SMKATB Minimalist Premium v3.0</title><style>html,body{margin:0;height:100%;background:#f6f8fb}iframe{height:100%;width:100%;display:block;border:0}#error{display:none;max-width:640px;margin:12vh auto;padding:25px;font:15px/1.6 Arial;background:white;border:1px solid #e5eaf1;border-radius:12px;color:#27415b}#error code{background:#f0f3f7;padding:2px 5px}</style></head><body><div id="error"><h2>Pratonton belum tersedia</h2><p>Fail pratonton ini perlu dimuat naik ke folder GitHub yang sama dengan <code>DRA0001.html</code> dan <code>minimalist-v3.css</code>. Pratonton menggunakan portal sebenar dan hanya menambah tema CSS.</p></div><iframe id="portal" src="DRA0001.html" title="Pratonton portal SMKA Tok Bachok versi minimalist"></iframe><script>(function(){const frame=document.getElementById('portal');const showError=()=>{document.getElementById('error').style.display='block';frame.style.display='none'};frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d||!d.querySelector('.sidebar')||!d.querySelector('.main-content'))return showError();const l=d.createElement('link');l.rel='stylesheet';l.href='minimalist-v3.css?v=3';d.head.appendChild(l)}catch(e){showError()}})})();</script></body></html>
