<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TMUA Tok Bachok</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --white: #ffffff;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            margin: 0; padding: 0;
            color: var(--primary);
            min-height: 100vh;
        }

        /* HEADER */
        .header-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 40px 20px 90px 20px;
            text-align: center;
            color: white;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.3);
        }

        .logo-sekolah { 
            width: 90px; height: auto; 
            background: white; border-radius: 50%; padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 15px;
        }
        
        h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .sub-header { opacity: 0.9; font-size: 14px; margin-top: 5px; font-weight: 500; }

        /* CONTAINER UTAMA */
        .container { 
            max-width: 1050px; 
            margin: -60px auto 40px auto; 
            padding: 0 20px;
            display: flex; gap: 25px; align-items: flex-start;
        }

        /* KIRI: GRID BUTANG */
        .links-area { 
            flex: 2; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; 
        }

        .btn-card { 
            background: var(--white); padding: 20px; border-radius: 16px; 
            text-decoration: none; color: var(--primary);
            display: flex; align-items: center; gap: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .btn-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); 
            border-color: var(--accent);
        }

        .icon-box {
            width: 48px; height: 48px; flex-shrink: 0;
            background: #eff6ff; color: var(--accent);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        
        .btn-card:nth-child(even) .icon-box { background: #f0fdf4; color: #16a34a; }
        .btn-card:nth-child(3n) .icon-box { background: #fff1f2; color: #e11d48; }
        .btn-card:first-child .icon-box { background: #fdf4ff; color: #c026d3; }

        .text-box { display: flex; flex-direction: column; }
        .btn-title { font-weight: 700; font-size: 14px; line-height: 1.3; }
        .btn-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* KANAN: SIDEBOX (SOLAT, AUDIO & ENROLMEN) */
        .side-box { 
            flex: 1; background: var(--white); border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            position: sticky; top: 20px;
        }

        /* WIDGET WAKTU SOLAT */
        .prayer-widget {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 16px;
            padding: 20px;
            color: white;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2);
            border: 1px solid #334155;
        }

        .clock-display { font-size: 32px; font-weight: 800; letter-spacing: 1px; line-height: 1; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
        .date-display { font-size: 12px; color: #94a3b8; font-weight: 500; margin-bottom: 2px; }
        .hijri-display { font-size: 11px; color: #cbd5e1; font-weight: 400; margin-bottom: 15px; font-style: italic; }

        .prayer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .prayer-item { 
            background: rgba(255,255,255,0.08); padding: 8px 5px; border-radius: 8px; 
            display: flex; flex-direction: column; gap: 2px;
        }
        .prayer-name { font-size: 10px; color: #cbd5e1; text-transform: uppercase; font-weight: 600; }
        .prayer-time { font-size: 13px; font-weight: 700; color: #fff; }

        /* WIDGET AUDIO AL-QURAN */
        .audio-widget {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        
        .audio-title {
            font-size: 13px; font-weight: 800; color: var(--accent); 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
        }
        
        audio {
            width: 100%;
            height: 35px;
            outline: none;
            border-radius: 8px;
        }
        
        .audio-desc {
            font-size: 10px; color: var(--text-muted); margin-top: 8px; font-weight: 500;
        }

        /* ENROLMEN STYLES */
        .side-title { 
            font-size: 13px; font-weight: 800; color: var(--text-muted); 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; 
            display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px;
        }

        .grand-total-box {
            text-align: center; margin-bottom: 25px;
            background: #f1f5f9; color: var(--primary); padding: 15px; border-radius: 16px; border: 1px solid #e2e8f0;
        }
        .big-number { font-size: 32px; font-weight: 800; line-height: 1; color: var(--accent); }
        .big-label { font-size: 11px; opacity: 0.8; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .big-detail { font-size: 11px; margin-top: 5px; font-weight: 600; color: var(--text-muted); }

        .stat-list { display: flex; flex-direction: column; gap: 12px; }
        .stat-row { display: flex; align-items: center; font-size: 13px; gap: 10px; }
        .stat-left { width: 40px; display: flex; flex-direction: column; }
        .stat-label { font-weight: 700; color: var(--primary); }
        .stat-detail-mini { font-size: 9px; color: var(--text-muted); white-space: nowrap; }
        .stat-bar-bg { flex: 1; height: 6px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; width: 0%; transition: width 1s ease-out; }
