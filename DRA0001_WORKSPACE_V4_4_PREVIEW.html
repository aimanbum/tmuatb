<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.png" type="image/png"><title>Pratonton SMKATB Digital Workspace v4.4</title>
<style>html,body{margin:0;height:100%;background:#f7f9fc;font-family:system-ui,sans-serif}iframe{display:block;width:100%;height:100%;border:0}#error{display:none;max-width:620px;margin:12vh auto;background:white;border:1px solid #dce3ed;padding:25px;border-radius:14px;line-height:1.7}</style></head>
<body><div id="error" role="alert"><h2>Pratonton belum dapat dimuatkan</h2><p>Pastikan fail <code>DRA0001.html</code>, <code>workspace-v4.4.css</code> dan <code>workspace-v4.4.js</code> berada dalam folder yang sama. Portal asal tidak diubah.</p></div>
<iframe id="portal" src="DRA0001.html" title="Pratonton SMKATB Digital Workspace v4.4"></iframe>
<script>
const frame=document.getElementById('portal');
function fail(){document.getElementById('error').style.display='block';frame.style.display='none'}
frame.addEventListener('load',()=>{try{
 const d=frame.contentDocument;
 const favicon=d.createElement('link');favicon.rel='icon';favicon.type='image/png';favicon.href='logo.png';d.head.appendChild(favicon);
 if(!d||!d.getElementById('onestop')||!d.querySelector('.sidebar'))return fail();
 const sheet=d.createElement('link');sheet.rel='stylesheet';sheet.href='workspace-v4.4.css?v=44';d.head.appendChild(sheet);
 const script=d.createElement('script');script.src='workspace-v4.4.js?v=44';script.onerror=fail;d.body.appendChild(script);
}catch(e){fail()}});
</script></body></html>
